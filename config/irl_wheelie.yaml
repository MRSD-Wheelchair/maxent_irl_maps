experiment:
    save_to: /home/tartandriver/tartandriver_ws/workspace/experiments/irl
    name: irl_example
    device: cuda
    epochs: 10
    steps_per_epoch: -1
    save_every: 1

footprint:
    params: # from wheelie_skidsteer_mppi
        length: 1.0
        width: 1.0
            
        #displacement to get to the center of the footprint from the center of the rear axle
        length_offset: -0.0
        width_offset: 0.0
        
        nl: 5
        nw: 5

algo:
    type: MPPIIRLSpeedmaps
    params:
        batch_size: 24
        reg_coeff: 2.0e-08 # for the overall cost of the cost maps, the higher the cost will be lower
        speed_coeff: 0.0
        grad_clip: 10.0

#TODO nest configs
dataset:
    irl:
        min_speed: 0.0 # 1.0 #check the mini speed per second? (there will be 0 data point)
        sample_every: 10 # 1

    common:
        root_dir: /home/tartandriver/rosbags/irl_kitti_mixed2
        
        device: cuda
        use_multiprocessing: false

    datatypes:
        bev_data:
            dtype: BEVGrid
            dir: bev_map_radio
            
            args:
                remove_keys: [min_elevation, max_elevation, terrain]

        odometry:
            dtype: OdomRBState
            dir: odom
            temporal_sample: [0, 100] # can be changed to sample a longer trajectory

            args: {}

        image:
            dtype: Image
            #dir: image
            dir: image_rect_color

            args: {}

        image_intrinsics:
            dtype: Intrinsics
            #dir: image_intrinsics
            dir: camera_info

            args: {}

network:
    type: BEVToCostSpeed

    args:
        resnet_params:
            hidden_channels: [128]
            hidden_activation: relu

        cost_params:
            type: Categorical
            output_params:
                bounds: [0., 2.] #5
                nbins: 20

            net_params:
                hidden_channels: []
                hidden_activation: relu

        speed_params:
            type: Categorical
            output_params:
                bounds: [0., 15.]
                nbins: 15
                
            net_params:
                hidden_channels: []
                hidden_activation: relu

netopt:
    type: Adam
    params: 
        lr: 0.001
        weight_decay: 0.0001

solver:
    type: mpc
    mpc_fp: /home/tartandriver/tartandriver_ws/src/planning/maxent_irl_maps/config/mpc/wheelie_skidsteer_mppi.yaml
